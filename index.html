<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Chat</title>
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
  <input id="q" placeholder="質問して" style="width:300px">
  <button onclick="ask()">送信</button>
  <div id="a" style="margin-top:10px"></div>

  <script>
    async function ask() {
      const q = document.getElementById("q").value;
      const r = await puter.ai.chat(q);
      document.getElementById("a").textContent = r;
    }
  </script>
</body>
</html>
